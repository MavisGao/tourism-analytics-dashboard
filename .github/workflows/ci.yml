name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

  frontend:
    name: React tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run React tests
        run: npm test

      - name: Build frontend
        run: npm run build

  deploy-backend:
    name: Publish and deploy Django image
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/mavisgao/tourism-analytics-dashboard-api:sha-${{ github.sha }}
      CONTAINER_APP_NAME: tourism-dashboard-api
      CONTAINER_APP_RESOURCE_GROUP: tourism-dashboard-rg
      HEALTH_URL: https://tourism-dashboard-api.jollyfield-b60455d2.centralus.azurecontainerapps.io/api/health/
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Django image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/mavisgao/tourism-analytics-dashboard-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$CONTAINER_APP_RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Verify deployed image
        run: |
          deployed_image="$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$CONTAINER_APP_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          test "$deployed_image" = "$IMAGE"

      - name: Verify backend health
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$HEALTH_URL"
