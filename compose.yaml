services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tourism_dashboard
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: tourism_dev_only
    volumes:
      - tourism_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourism -d tourism_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://tourism:tourism_dev_only@db:5432/tourism_dashboard
      DJANGO_SECRET_KEY: local-docker-demo-key-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  tourism_postgres_data:
